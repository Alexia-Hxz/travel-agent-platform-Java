# 一键起全栈：MySQL 8 + Milvus 2.4(standalone) + Java 后端。
#
#   docker compose up -d --build
#   后端   http://127.0.0.1:8001/api/v1/health
#   Milvus 127.0.0.1:19530
#
# 前端不进容器：在 frontend/ 下 `npm install && npm run dev`，默认 5173，
# 它请求的正是 http://127.0.0.1:8001/api/v1。
#
# 首次启动前，把 backend/.env 里的 DASHSCOPE_API_KEY / PEXELS_API_KEY 填好；
# 本文件通过 env_file 读取它，密钥不进镜像也不进仓库。

services:
  mysql:
    container_name: travel-mysql
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travel_root_pwd}
      MYSQL_DATABASE: travel_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  etcd:
    container_name: travel-etcd
    image: quay.io/coreos/etcd:v3.5.5
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: travel-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: travel-milvus
    image: milvusdb/milvus:v2.4.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    depends_on:
      - etcd
      - minio

  backend:
    container_name: travel-backend
    build:
      context: ./backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      SERVER_PORT: "8000"
      DB_URL: jdbc:mysql://mysql:3306/travel_agent?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-travel_root_pwd}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      VECTOR_BACKEND: milvus
    ports:
      - "8001:8000"
    volumes:
      # 上传的文件与照片缓存要持久化，否则容器重启后"资料还在、原文没了"
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_healthy

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
